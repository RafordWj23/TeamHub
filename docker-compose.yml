services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teamhub
      POSTGRES_PASSWORD: teamhub
      POSTGRES_DB: teamhub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamhub"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://teamhub:teamhub@db:5432/teamhub
      JWT_SECRET: dev-secret
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend 